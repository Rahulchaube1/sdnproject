name: SDN Policy Verification CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: OpenFlow 1.3 Policy Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run Policy Verification Test Suite
      run: |
        python verify_policy.py

    - name: Verify Web Console Server Startup & Endpoints
      run: |
        python server.py --port 8080 &
        SERVER_PID=$!
        sleep 2
        curl -fail http://127.0.0.1:8080/api/state
        curl -fail http://127.0.0.1:8080/
        kill $SERVER_PID
